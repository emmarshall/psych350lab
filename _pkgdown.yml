url: https://emmarshall.github.io/psych350lab/
template:
  bootstrap: 5
  bslib:
    bootswatch: materia
    bg: "#F5F5F5"
    fg: "#072e3c"
    primary: "#ff6361"
    base_font: {google: "IBM Plex Sans"}
    heading_font: {google: "Newsreader"}

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

articles:
  - title: "Getting Started"
    contents:
      - homework-checkers
  - title: "SPSS-Style Output"
    contents:
      - spss-tables-html
      - spss-tables-typst
      - spss-plots

reference:
  - title: "Data"
    contents:
      - superman
      - superman_smes

  - title: "Descriptive Statistics"
    contents:
      - compute_summary_stats
      - create_univariate_checker
      - create_answer_table
      - create_descriptive_table

  - title: "Data Import"
    contents:
      - get_spss_data

  - title: "Correlation Analysis"
    contents:
