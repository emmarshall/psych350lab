project:
  type: website
  output-dir: ../docs/

# Note: freeze functionality can be set at a project level or for individual .qmd files
#execute:
#   freeze: false

website:
  title: "$ALTDOC_PACKAGE_NAME"
  code-links: true
  navbar:
    logo: logo.png
    search: true
    right:
      - icon: github
        href: $ALTDOC_PACKAGE_URL_GITHUB
        aria-label: $ALTDOC_PACKAGE_NAME GitHub
  sidebar:
    collapse-level: 1
    contents:
      - text: Home
        file: index.qmd
      - text: Getting Started
        file: vignettes/getting-started.qmd
      - section: Guides by Analysis Type
        contents:
          - text: Correlations
            file: vignettes/correlations.qmd
          - text: Chi-Square (2×2)
            file: vignettes/chi-square-2x2.qmd
          - text: One-Way ANOVA (BG & WG)
            file: vignettes/oneway-anova.qmd
          - text: K-Group One-Way ANOVA
            file: vignettes/kgroup-anova.qmd
          - text: K-Group Chi-Square (k×2)
            file: vignettes/kgroup-chi-square.qmd
          - text: Factorial ANOVA (2×2)
            file: vignettes/factorial-anova.qmd
          - text: Multiple Linear Regression
            file: vignettes/regression.qmd
      - section: $ALTDOC_MAN_BLOCK
      - text: News
        file: $ALTDOC_NEWS
      - text: Changelog
        file: $ALTDOC_CHANGELOG
      - text: License
        file: $ALTDOC_LICENSE
      - text: Licence
        file: $ALTDOC_LICENCE
      - text: Code of conduct
        file: $ALTDOC_CODE_OF_CONDUCT
      - text: Citation
        file: $ALTDOC_CITATION

format:
  html:
    code-link: true
    theme:
      - default
      - custom.scss
    toc: true
    highlight-style: github

brand: _brand.yml
